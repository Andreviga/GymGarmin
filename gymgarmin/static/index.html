<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1317" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Hybrid Lab">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <title>Hybrid Lab</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="wordmark">Hybrid <span>Lab</span></h1>
    <span id="garmin-pill" class="pill muted" title="Conexão Garmin">Garmin: —</span>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabbar" aria-label="Navegação">
    <a href="#hoje" data-tab="hoje" aria-label="Hoje" title="Hoje"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">Hoje</span></a>
    <a href="#planilhas" data-tab="planilhas" aria-label="Planilhas" title="Planilhas"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="lbl">Planilhas</span></a>
    <a href="#treinar" data-tab="treinar" aria-label="Treinar" title="Treinar"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg><span class="lbl">Treinar</span></a>
    <a href="#analise" data-tab="analise" aria-label="Análise" title="Análise"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="lbl">Análise</span></a>
    <a href="#exercicios" data-tab="exercicios" aria-label="Exercícios" title="Exercícios"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Exercícios</span></a>
    <a href="#perfil" data-tab="perfil" aria-label="Perfil" title="Perfil"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="lbl">Perfil</span></a>
  </nav>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" aria-label="Fechar">×</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="timer" class="timer" hidden>
    <div class="timer-label">Descanso</div>
    <div id="timer-value" class="timer-value">0:00</div>
    <div class="row gap">
      <button class="btn ghost" data-timer="-15">−15s</button>
      <button class="btn ghost" data-timer="+15">+15s</button>
      <button class="btn" data-timer="stop">Pular</button>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
