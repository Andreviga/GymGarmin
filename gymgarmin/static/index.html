<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>GymGarmin</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>GymGarmin</h1>
    <span id="garmin-pill" class="pill muted" title="Conexão Garmin">Garmin: —</span>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabbar" aria-label="Navegação">
    <a href="#hoje" data-tab="hoje"><span class="ico">◉</span>Hoje</a>
    <a href="#planilhas" data-tab="planilhas"><span class="ico">▤</span>Planilhas</a>
    <a href="#treinar" data-tab="treinar"><span class="ico">▶</span>Treinar</a>
    <a href="#analise" data-tab="analise"><span class="ico">▥</span>Análise</a>
    <a href="#exercicios" data-tab="exercicios"><span class="ico">☰</span>Exercícios</a>
    <a href="#perfil" data-tab="perfil"><span class="ico">⚙</span>Perfil</a>
  </nav>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" aria-label="Fechar">×</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="timer" class="timer" hidden>
    <div class="timer-label">Descanso</div>
    <div id="timer-value" class="timer-value">0:00</div>
    <div class="row gap">
      <button class="btn ghost" data-timer="-15">−15s</button>
      <button class="btn ghost" data-timer="+15">+15s</button>
      <button class="btn" data-timer="stop">Pular</button>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
